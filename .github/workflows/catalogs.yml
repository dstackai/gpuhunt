name: Collect and publish catalogs
run-name: Collect and publish catalogs${{ inputs.staging && ' (staging)' || '' }}
on:
  workflow_dispatch:
    inputs:
      staging:
        description: Staging
        type: boolean
        default: true
  schedule:
    - cron: '5 * * * *' # Run every hour at HH:05

env:
  PYTHON_VERSION: 3.13
  BUCKET: s3://dstack-gpu-pricing${{ github.event_name == 'workflow_dispatch' && inputs.staging && '/stgn' || '' }}

jobs:
  catalog-aws:
    name: Collect AWS catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra aws
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: uv run python -m gpuhunt aws --output ../aws.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_aws.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh aws
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-aws
          path: aws.csv
          retention-days: 1

  catalog-azure:
    name: Collect Azure catalog
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra azure
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: uv run python -m gpuhunt azure --output ../azure.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_azure.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh azure
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-azure
          path: azure.csv
          retention-days: 1

  catalog-verda:
    name: Collect Verda catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra verda
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        env:
          VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
          VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
        run: uv run python -m gpuhunt verda --output ../verda.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_verda.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh verda
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-verda
          path: verda.csv
          retention-days: 1

  catalog-gcp:
    name: Collect GCP catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/531508670106/locations/global/workloadIdentityPools/github-identity-pool/providers/github-id-provider'
          service_account: 'dstack-gpu-pricing-ci@dstack.iam.gserviceaccount.com'
          create_credentials_file: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra gcp
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: uv run python -m gpuhunt gcp --output ../gcp.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_gcp.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh gcp
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-gcp
          path: gcp.csv
          retention-days: 1

  catalog-lambdalabs:
    name: Collect LambdaLabs catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        env:
          LAMBDALABS_TOKEN: ${{ secrets.LAMBDALABS_TOKEN }}
        run: uv run python -m gpuhunt lambdalabs --output ../lambdalabs.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_lambdalabs.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh lambdalabs
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-lambdalabs
          path: lambdalabs.csv
          retention-days: 1

  catalog-nebius:
    name: Collect Nebius catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra nebius
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        run: |
          echo "${{ secrets.NEBIUS_PRIVATE_KEY }}" > "${NEBIUS_PRIVATE_KEY_FILE}"
          uv run python -m gpuhunt nebius --output ../nebius.csv
        env:
          NEBIUS_SERVICE_ACCOUNT_ID: ${{ secrets.NEBIUS_SERVICE_ACCOUNT_ID }}
          NEBIUS_PUBLIC_KEY_ID: ${{ secrets.NEBIUS_PUBLIC_KEY_ID }}
          NEBIUS_PRIVATE_KEY_FILE: /tmp/nebius.key
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_nebius.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh nebius
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-nebius
          path: nebius.csv
          retention-days: 1

  catalog-oci:
    name: Collect OCI catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra oci
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        run: uv run python -m gpuhunt oci --output ../oci.csv
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_oci.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh oci
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-oci
          path: oci.csv
          retention-days: 1

  catalog-runpod:
    name: Collect Runpod catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        run: uv run python -m gpuhunt runpod --output ../runpod.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_runpod.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh runpod
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-runpod
          path: runpod.csv
          retention-days: 1

  catalog-cloudrift:
    name: Collect CloudRift catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv tool install awscli
      - name: Collect catalog
        working-directory: src
        run: uv run python -m gpuhunt cloudrift --output ../cloudrift.csv
      - name: Test catalog integrity
        env:
          CATALOG_DIR: .
        run: uv run pytest src/integrity_tests/test_all.py src/integrity_tests/test_cloudrift.py
      - name: Publish catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/publish_catalog.sh cloudrift
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs-cloudrift
          path: cloudrift.csv
          retention-days: 1

  # Online providers have no catalog to publish, only offers fetched at query time
  test-hotaisle:
    name: Test Hot Aisle integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run integrity tests
        env:
          HOTAISLE_API_KEY: ${{ secrets.HOTAISLE_API_KEY }}
          HOTAISLE_TEAM_HANDLE: ${{ secrets.HOTAISLE_TEAM_HANDLE }}
        run: uv run pytest src/integrity_tests/test_hotaisle.py

  test-vastai:
    name: Test Vast.ai integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run integrity tests
        run: uv run pytest src/integrity_tests/test_vastai.py

  # The v2 catalog bundles all providers into a single file. It is published for dstack
  # installations that predate per-provider v3 catalogs and, unlike the v3 catalogs, is
  # only updated when every provider has been collected successfully.
  publish-catalog-v2:
    name: Publish v2 catalog
    needs:
      - catalog-aws
      - catalog-azure
      - catalog-verda
      - catalog-gcp
      - catalog-lambdalabs
      - catalog-nebius
      - catalog-oci
      - catalog-runpod
      - catalog-cloudrift
    runs-on: ubuntu-latest
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # settings to prevent warnings when running uv without a repo checkout
          enable-cache: false
          ignore-empty-workdir: true
      - name: Install AWS CLI
        run: uv tool install awscli
      - uses: actions/download-artifact@v4
        with:
          pattern: catalogs-*
          merge-multiple: true
          path: v2/
      - name: Copy Verda catalog for backward compatibility
        run: cp v2/verda.csv v2/datacrunch.csv
      - name: Write version
        run: echo "$(date +%Y%m%d)-${{ github.run_number }}" > v2/version
      - name: Package catalogs
        run: zip -j v2/catalog.zip v2/*.csv v2/version
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          VERSION=$(cat v2/version)
          aws s3 cp v2/catalog.zip "$BUCKET/v2/$VERSION/catalog.zip" --acl public-read
          echo $VERSION | aws s3 cp - "$BUCKET/v2/version" --acl public-read
          aws s3 cp "$BUCKET/v2/$VERSION/catalog.zip" "$BUCKET/v2/latest/catalog.zip" --acl public-read

  report:
    name: Report catalog status
    if: always()
    needs:
      - catalog-aws
      - catalog-azure
      - catalog-verda
      - catalog-gcp
      - catalog-lambdalabs
      - catalog-nebius
      - catalog-oci
      - catalog-runpod
      - catalog-cloudrift
      - test-hotaisle
      - test-vastai
      - publish-catalog-v2
    runs-on: ubuntu-latest
    steps:
      - name: Write job statuses to the run summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "$RESULTS" | jq -r 'to_entries[]
              | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
